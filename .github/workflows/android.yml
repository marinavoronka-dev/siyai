name: Android APK
on:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:
    inputs:
      signing:
        description: 'debug: тестовый APK; release: постоянная подпись из Secrets'
        type: choice
        options: [debug, release]
        default: debug
permissions:
  contents: read
jobs:
  apk:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install SDK components
        shell: pwsh
        run: |
          $manager = "$env:ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager.bat"
          & $manager 'platforms;android-35' 'build-tools;35.0.0'
          if ($LASTEXITCODE -ne 0) { throw 'SDK installation failed' }
      - name: Restore release key
        if: inputs.signing == 'release'
        shell: pwsh
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if (-not $env:KEYSTORE_BASE64) { throw 'Configure ANDROID_KEYSTORE_BASE64 in repository Secrets first' }
          [IO.File]::WriteAllBytes("$env:RUNNER_TEMP/signing.p12", [Convert]::FromBase64String($env:KEYSTORE_BASE64))
      - name: Build and verify APK
        shell: pwsh
        env:
          SIGNING_MODE: ${{ inputs.signing || 'debug' }}
          SIYAI_KEYSTORE_PATH: ${{ runner.temp }}/signing.p12
          SIYAI_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          SIYAI_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          SIYAI_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          ./android/build.ps1 -JavaHome $env:JAVA_HOME -BuildTools "$env:ANDROID_HOME/build-tools/35.0.0" -AndroidJar "$env:ANDROID_HOME/platforms/android-35/android.jar" -SigningMode $env:SIGNING_MODE -Output "$env:GITHUB_WORKSPACE/android/build/Siyai-Mia.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: Siyai-Mia-${{ inputs.signing || 'debug' }}
          path: android/build/Siyai-Mia.apk
          if-no-files-found: error
          retention-days: 30
